[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "loclm"
version = "7.0.0"
description = "LocLM — Universal Fully Offline Local AI Assistant"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "LocLM Contributors" },
]
keywords = ["ai", "local", "offline", "llm", "assistant", "agent", "privacy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "psutil>=5.9.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3.0",
]

[project.scripts]
loclm = "loclm.main:run"

[tool.hatch.build.targets.wheel]
packages = ["loclm"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
